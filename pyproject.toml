[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reelbot"
version = "0.1.0"
description = "Telegram workflow for subtitling, reviewing, and publishing short videos to Instagram Reels"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "aiogram==3.13.1",
  "aiosqlite==0.20.0",
  "fastapi==0.115.6",
  "gdown==5.2.0",
  "httpx==0.28.1",
  "openai==1.59.7",
  "Pillow==11.1.0",
  "pydantic-settings==2.7.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "respx==0.22.0",
  "ruff==0.9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

